name: Store checks and deploy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: store_test
          POSTGRES_USER: store_test
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: node --check app/static/experience.js
      - run: node --test tests/navigation.test.cjs
      - run: python -m compileall -q app
      - run: python -m pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://store_test:ci_only_password@localhost:5432/store_test
  deploy:
    name: Deploy Alwaysdata
    needs: tests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: alwaysdata-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://elrincondidactico.alwaysdata.net
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy tested commit and verify public version
        env:
          ALWAYS_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          ALWAYS_KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_KNOWN_HOSTS }}
          ALWAYS_ACCOUNT: elrincondidactico
          ALWAYS_HOST: ssh-elrincondidactico.alwaysdata.net
          ALWAYS_PROJECT: /home/elrincondidactico/el-rincon-didactico
          ALWAYS_PYTHON: /home/elrincondidactico/venv/bin/python
          ALWAYS_URL: https://elrincondidactico.alwaysdata.net
          DEPLOY_SHA: ${{ github.sha }}
        run: python -m deploy.actions
