{% extends "base.html" %}{% block content %}<section class="section narrow"><a class="back" href="{{ url_for('main.admin') }}">← Volver al panel</a><h1 class="page-title">{{ 'Editar recurso' if product.id else 'Un nuevo recurso.' }}</h1><form class="stack-form" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Título<input name="title" required maxlength="160" value="{{ product.title or '' }}"></label><label>Descripción<textarea name="description" required maxlength="10000" rows="6">{{ product.description or '' }}</textarea></label><div class="form-grid"><label>Categoría<input name="category" required maxlength="80" value="{{ product.category or '' }}" placeholder="Ej. Juego simbólico"></label><label>Edad o nivel sugerido<input name="age" maxlength="80" value="{{ product.age or '' }}" placeholder="Ej. Sala de 2 y 3"></label><label>Formato<select name="kind"><option value="digital" {% if product.kind=='digital' %}selected{% endif %}>Digital / imprimible</option><option value="physical" {% if product.kind=='physical' %}selected{% endif %}>Material físico</option></select></label><label>Precio en pesos argentinos<input name="price" inputmode="decimal" required value="{{ '%.2f'|format(product.price_cents/100) if product.price_cents else '' }}" placeholder="Ej. 2500,00"></label><label>Stock (solo materiales físicos)<input name="stock" type="number" min="0" max="100000" value="{{ product.stock or 0 }}"></label></div><label>Foto de portada<input name="image" type="file" accept="image/jpeg,image/png,image/webp"><span class="muted">JPG, PNG o WebP, hasta 5 MB. {% if product.image %}Ya hay una portada; subir otra la reemplaza.{% endif %}</span></label><label>Archivo digital privado<input name="digital_file" type="file" accept=".pdf,.zip"><span class="muted">PDF o ZIP. El formulario completo admite hasta 20 MB. {% if product.digital_file %}Ya hay un archivo; los pedidos anteriores conservarán su versión.{% endif %}</span></label><label class="check"><input type="checkbox" name="published" {% if product.published %}checked{% endif %}>Publicar en el catálogo</label><p class="muted">Para publicar un recurso digital es obligatorio adjuntar su archivo.</p><button class="button">Guardar recurso</button></form></section>{% endblock %}
